<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X酒精路跑</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .card {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .card h2 {
            margin-top: 0;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
            color: #2980b9;
        }
        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .name-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .name-list input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .vip-section {
            margin-top: 15px;
            padding: 15px;
            background-color: #fcf3cf;
            border-radius: 5px;
            border-left: 5px solid #f1c40f;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2ecc71;
        }
        .btn-draw {
            background-color: #e67e22;
        }
        .btn-draw:hover {
            background-color: #f39c12;
        }
        .btn-draw-drink {
            background-color: #8e44ad;
        }
        .btn-draw-drink:hover {
            background-color: #9b59b6;
        }
        .result-box {
            margin-top: 15px;
            padding: 15px;
            background-color: #e8f8f5;
            border-left: 5px solid #1abc9c;
            border-radius: 4px;
            font-size: 18px;
            line-height: 1.6;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            resize: vertical;
        }
        .captain {
            color: #c0392b;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>🎮 X酒精路跑</h1>

    <!-- 第一部分：分組系統 -->
    <div class="card">
        <h2>👥 隨機分隊 (含特別來賓機制)</h2>
        
        <div class="input-grid">
            <div class="name-list">
                <h3>男生名單</h3>
                <input type="text" id="m1" placeholder="男生 1" value="MK">
                <input type="text" id="m2" placeholder="男生 2" value="james">
                <input type="text" id="m3" placeholder="男生 3" value="阿文">
                <input type="text" id="m4" placeholder="男生 4" value="史迪">
                <input type="text" id="m5" placeholder="男生 5" value="andy">
                <input type="text" id="m6" placeholder="男生 6" value="台北E">
            </div>
            <div class="name-list">
                <h3>女生名單</h3>
                <input type="text" id="f1" placeholder="女生 1" value="Bella">
                <input type="text" id="f2" placeholder="女生 2" value="琳琳">
                <input type="text" id="f3" placeholder="女生 3" value="crystal">
                <input type="text" id="f4" placeholder="女生 4" value="奇奇">
                <input type="text" id="f5" placeholder="女生 5" value="cindy">
                <input type="text" id="f6" placeholder="女生 6" value="台北D">
            </div>
        </div>
        
        <div class="vip-section">
            <label style="font-weight:bold;">🌟 特別來賓 (將隨機加入任一隊伍)：</label>
            <input type="text" id="vip" value="EC" style="padding: 5px; width: 100px; margin-left:10px;">
            <div style="font-size: 14px; color: #7f8c8d; margin-top:5px;">💡 james 與 MK 擔任隊長的機率較其他人提升 20%</div>
        </div>

        <button onclick="generateTeams()">一鍵隨機分隊</button>
        <div id="team-result" class="result-box" style="display: none;"></div>
    </div>

    <!-- 第二部分：遊戲籤筒 -->
    <div class="card">
        <h2>🅰️ 遊戲籤筒 (行動關卡)</h2>
        <textarea id="boxA">1 一人戴眼罩，另一人只能透過「扶肩膀」或「牽手」引導到下一間7-11。
2 公主抱到下一關。(體力不支可以換人如全員男孩放棄需每人喝一杯)
3 全隊男女手牽手到下一關
4 全隊男女交錯搭火車到下一關
5 一男一女兩兩手勾手橫著走到下一關
6 拿一根吸管用嘴巴和鼻子夾住，如果中途吸管掉下來，懲罰蛙跳5下或開合跳10下
7 便利商店買膠帶，兩人三腳走到下一關
8 親親大亂鬥！全隊男女親親五秒「各自分組」不得與本來的伴侶執行遊戲
9 老背少！挑一位男生背隊內年紀最小的女生走行至下一關，中間可換人但必須也是比女生年紀大者。
10 愛的小秘密！隊內剪刀石頭布，最輸的兩個人與敵對進行真心話遊戲。回答一個私密問題。
11 我殺豬養你呀！隊內挑選一位男性為敵對女性購買對方想吃的小零食，並以口對口餵敵方女生吃。
12 老娘千杯不醉！隊內一位女生隨機找一位路人乾杯🍻並且說出「老娘千杯不醉」。
13 一首歌的時間！隊內選出一位歌手，一路唱歌抵達下一站，中途如果歌曲結束下一關不管輸贏都要多喝一杯。
14 魷魚🦑遊戲！全隊在人行道上尋找一根柱子玩123木頭人，最輸的下一站不管輸贏多喝一杯。
15 愛上鐵達尼！隊內挑選一男一女擺出鐵達尼經典姿勢動作一路到下一關，路程中不能分開
16 每隊自行選出一位女孩牽二位男孩到下一關(如人數過多可以 二組)
17 每隊自行選出一位男孩牽二位女孩到下一關(如人數過多可以 二組)
18 抽到此簽，隊伍男男互牽 女女互牽到下一關
19 選出 ? 位戴著"頭套"到下一關
20 隊長福利可自由選對方隊伍一位做任何事 ( 不得傷風敗俗，敗壞風氣)
21 騎馬打仗二位男孩當馬兒，選一位女孩上馬到下一關</textarea>
        <button class="btn-draw" onclick="drawGame('boxA', 'resultA')">一鍵抽取 遊戲籤</button>
        <div id="resultA" class="result-box" style="display: none;"></div>
    </div>

    <!-- 第三部分：喝酒遊戲籤筒 -->
    <div class="card">
        <h2>🅱️ 喝酒遊戲籤筒 (駐點遊戲)</h2>
        <textarea id="boxB">1 五、十、十五：兩人一組，喊中數字的人贏，輸的喝。
2 我有你沒有：輪流說一件自己「沒做過」的事，有做過的人就喝。
3 黑白配：經典手指方向遊戲，二人一組輸的的人喝。
4 人緣好：大家數到三，指一個人，被指最多的人喝。
5 大老二(簡易版)：每人抽一張牌，點數最小的三個人負責喝。
6 成語接龍：上一家的最後一字接下一家的第一字，斷掉就喝。
7 看誰比較快：所有人一起乾杯，最後放下的那個人要加碼喝。
8 抓鬼遊戲：隊長當鬼，鬼做什麼動作大家要跟著做，最後做的與"隊長"一起喝。
9 國王遊戲：抽籤當國王，國王可以指名 1~6 號中的任意組合喝。
10 隊長指定：隊長指定敵對二位喝</textarea>
        <button class="btn-draw" onclick="drawGame('boxB', 'resultB')">一鍵抽取 喝酒遊戲</button>
        <div id="resultB" class="result-box" style="display: none;"></div>
    </div>

    <!-- 第四部分：7-11 酒單籤筒 -->
    <div class="card">
        <h2>🍻 7-11 盲飲酒單籤筒</h2>
        <textarea id="boxC">1 金牌台灣啤酒 (經典不敗)
2 18天台灣生啤酒 (尚青推薦)
3 Kirin 冰結 水果調酒 (果香氣泡)
4 HOROYOI 微醉沙瓦 (妹酒首選)
5 海尼根 Heineken
6 百威啤酒 Budweiser
7 檸檬堂 日式檸檬沙瓦
8 韓國真露燒酒 (原味或隨機水果口味)
9 SOMERSBY 夏日蜜蘋果酒
10 WAT 瓶裝雞尾酒
11 Asahi 朝日 Super Dry
12 臺虎精釀系列 (現場隨機挑一款)
13 Kirin 麒麟一番搾
14 傑克丹尼 可樂威士忌調酒 (Jack & Cola 罐裝)
15 絕對伏特加 Absolut (小樣酒系列)</textarea>
        <button class="btn-draw btn-draw-drink" onclick="drawGame('boxC', 'resultC')">一鍵抽取 7-11 酒款</button>
        <div id="resultC" class="result-box" style="display: none;"></div>
    </div>

    <script>
        // 洗牌演算法
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 帶權重的隊長抽取器
        function selectCaptain(team) {
            let weights = [];
            let totalWeight = 0;

            // 給予權重：james 或是 MK 權重為 120 (多20%)，其他人為 100
            for(let i = 0; i < team.length; i++) {
                let name = team[i].trim();
                if(name === 'james' || name === 'MK') {
                    weights.push(120);
                    totalWeight += 120;
                } else {
                    weights.push(100);
                    totalWeight += 100;
                }
            }

            // 根據權重抽取
            let randomValue = Math.random() * totalWeight;
            let currentSum = 0;
            
            for(let i = 0; i < team.length; i++) {
                currentSum += weights[i];
                if(randomValue <= currentSum) {
                    return i;
                }
            }
            return 0; // 防呆機制
        }

        // 產生分隊
        function generateTeams() {
            let males = [];
            let females = [];
            
            // 讀取男女生
            for(let i=1; i<=6; i++) {
                males.push(document.getElementById('m'+i).value || '男生'+i);
                females.push(document.getElementById('f'+i).value || '女生'+i);
            }
            
            let vip = document.getElementById('vip').value || 'EC';

            // 打亂男女陣列
            males = shuffleArray(males);
            females = shuffleArray(females);

            // 分配隊伍 (初步各 3男 3女)
            let team1 = [...males.slice(0, 3), ...females.slice(0, 3)];
            let team2 = [...males.slice(3, 6), ...females.slice(3, 6)];

            // 決定 VIP 去哪一隊 (0 代表隊伍1，1 代表隊伍2)
            let vipGoesTo = Math.floor(Math.random() * 2);
            if(vipGoesTo === 0) {
                team1.push(vip);
            } else {
                team2.push(vip);
            }

            // 抽取隊長 (套用權重邏輯)
            let cap1Index = selectCaptain(team1);
            let cap2Index = selectCaptain(team2);

            team1[cap1Index] = `<span class="captain">👑 ${team1[cap1Index]} (隊長)</span>`;
            team2[cap2Index] = `<span class="captain">👑 ${team2[cap2Index]} (隊長)</span>`;

            // 顯示結果
            const resultDiv = document.getElementById('team-result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `
                <strong>🔴 第一隊 (${team1.length}人)：</strong><br>${team1.join('、')}<br><br>
                <strong>🔵 第二隊 (${team2.length}人)：</strong><br>${team2.join('、')}
            `;
        }

        // 抽籤邏輯
        function drawGame(boxId, resultId) {
            const text = document.getElementById(boxId).value;
            const items = text.split('\n').map(item => item.trim()).filter(item => item !== '');

            const resultDiv = document.getElementById(resultId);
            resultDiv.style.display = 'block';

            if(items.length === 0) {
                resultDiv.innerHTML = '<span style="color: red;">⚠️ 請先在上方輸入內容！</span>';
                return;
            }

            const randomIndex = Math.floor(Math.random() * items.length);
            resultDiv.innerHTML = `🎯 <strong>抽中：</strong> <br><br> <span style="color:#d35400; font-size: 22px; font-weight: bold;">${items[randomIndex]}</span>`;
        }
    </script>
</body>
</html>
