<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X 歡樂酒精路跑 X</title>
    <!-- 引入 LZ-String 壓縮套件 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <style>
        /* 整體微醺派對與聯誼氛圍背景 */
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background: radial-gradient(circle at top right, #3a1c71, #d76d77, #ffaf7b);
            background-attachment: fixed;
            color: #fff;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 玻璃擬態 (Glassmorphism) 卡片設計 */
        header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 40px 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }
        
        header::before {
            content: "🥂 🍸 🍷 🍻";
            position: absolute;
            bottom: 10px;
            left: 20px;
            color: rgba(255,255,255,0.3);
            font-size: 24px;
            letter-spacing: 15px;
        }

        h1 {
            margin: 0;
            color: #fff;
            font-size: 36px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px #ff6b81;
            letter-spacing: 2px;
        }

        .card {
            background: rgba(20, 20, 35, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .card h2 {
            margin-top: 0;
            border-bottom: 2px solid rgba(255, 107, 129, 0.5);
            padding-bottom: 10px;
            color: #ff9a9e;
            text-shadow: 0 0 8px rgba(255, 154, 158, 0.5);
        }

        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .name-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .name-list h3 {
            color: #a18cd1;
            margin-bottom: 5px;
        }

        .name-list input {
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 8px;
            outline: none;

            box-sizing: border-box;
        }

        .name-list input:focus {

            border-color: #ff9a9e;
            box-shadow: 0 0 8px rgba(255, 154, 158, 0.4);
        }

        .name-list input::placeholder {
            color: rgba(255,255,255,0.5);
        }

        /* 漸層發光按鈕 */
        button {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 65, 108, 0.6);
        }

        .btn-draw-action {
            background: linear-gradient(45deg, #f12711, #f5af19);
            box-shadow: 0 4px 15px rgba(245, 175, 25, 0.4);
        }
        
        .btn-draw-action:hover {
            box-shadow: 0 6px 20px rgba(245, 175, 25, 0.6);
        }

        .btn-draw-combo {
            background: linear-gradient(45deg, #8E2DE2, #4A00E0);
            box-shadow: 0 4px 15px rgba(142, 45, 226, 0.4);
        }

        .btn-draw-combo:hover {
            box-shadow: 0 6px 20px rgba(142, 45, 226, 0.6);
        }

        .btn-settings {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: none;
            backdrop-filter: blur(5px);
        }

        .btn-settings:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }

        .result-box {
            margin-top: 20px;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.4);
            border-left: 5px solid #ff416c;
            border-radius: 8px;
            font-size: 18px;
            line-height: 1.6;
            color: #fff;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .team-display {
            padding: 15px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }

        .team-title { font-weight: bold; font-size: 22px; margin-bottom: 12px; display: block; text-shadow: 0 0 5px currentColor; }
        .member-line { margin: 8px 0; font-size: 16px; }
        
        /* 彈出視窗 (Modal) 樣式 - 暗黑風格 */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            overflow: auto; 
            background-color: rgba(0,0,0,0.8); 
            backdrop-filter: blur(8px);
        }
        
        .modal-content {
            background: #1e1e2d;
            color: #fff;
            margin: 5% auto; 
            padding: 30px;
            border-radius: 15px;
            width: 90%; 
            max-width: 800px;
            box-shadow: 0 5px 30px rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.1);
            box-sizing: border-box;
        }

        .modal-content h2 { color: #ff9a9e; }
        .modal-content h3 { color: #a18cd1; margin-top: 25px; margin-bottom: 10px; }
        
        textarea {
            width: 100%;
            height: 130px;
            padding: 12px;
            background: rgba(0,0,0,0.3);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            box-sizing: border-box;
            resize: vertical;
            font-size: 15px;
            line-height: 1.5;
        }
        
        textarea:focus {
            outline: none;
            border-color: #a18cd1;
            box-shadow: 0 0 8px rgba(161, 140, 209, 0.5);
        }

        .action-bar {
            display: flex; 
            gap: 15px; 
            margin-top: 30px;
        }
        @media (max-width: 600px) {
            .action-bar {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

        <h1>🍺 歡樂酒精路跑 🏃‍♂️💖</h1>
    </header>

    <!-- 分組系統 -->

                <input type="text" value="史帝夫">
                <input type="text" value="A紮男">
                <input type="text" value="史迪">
                <input type="text" value="Rich">
                <input type="text" value="Aden">
                <input type="text" placeholder="臨時加入(男)...">
            </div>
            <div class="name-list" id="female-inputs">
                <h3>💃 女生名單</h3>
                <input type="text" value="Crystal">
                <input type="text" value="琳琳">
                <input type="text" value="貝拉">
                <input type="text" value="小BOSS">
                <input type="text" value="蜜糖">
                <input type="text" value="33">
                <input type="text" value="奇奇">
                <input type="text" value="Mia">
                <input type="text" value="Cici">
                <input type="text" placeholder="臨時加入(女)...">
            </div>
        </div>

        <button onclick="generateTeams()">一鍵心跳隨機分隊</button>
        <div id="team-result" class="result-box" style="display: none;"></div>
    </div>

    <!-- 行動關卡 -->
    <div class="card">
        <h2>🅰️ 聯誼行動籤 (移動關卡)</h2>
        <button class="btn-draw-action" onclick="drawGame('boxA', 'resultA')">🎲 抽取 行動關卡任務</button>
        <div id="resultA" class="result-box" style="display: none;"></div>
    </div>

    <!-- 喝酒遊戲 + 盲飲酒單 雙效合併區塊 -->
    <div class="card">
        <h2>🅱️ 駐點心醉挑戰 (遊戲 + 盲飲)</h2>
        <button class="btn-draw-combo" onclick="drawCombinedGame('boxB', 'boxC', 'resultB')">🥂 一鍵雙抽：派對遊戲 ＆ 專屬酒單</button>
        <div id="resultB" class="result-box" style="display: none;"></div>
    </div>

    <!-- 最下方設定與同步按鈕 -->
    <div class="action-bar">
        <button class="btn-settings" onclick="openSettings()" style="margin-top: 0;">⚙️ 進入後台：編輯遊戲與酒單</button>
        <button class="btn-settings" onclick="copyShareLink()" style="margin-top: 0; background: rgba(56, 239, 125, 0.15); border-color: rgba(56, 239, 125, 0.4);">🔗 複製短網址 (跨裝置同步)</button>
    </div>

    <!-- 編輯內容彈出視窗 (Modal) -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <h2 style="margin-top:0; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 15px;">⚙️ 編輯內容 (輸入即自動儲存)</h2>
            
            <h3>🅰️ 行動關卡籤筒</h3>
            <textarea id="boxA">1 一人戴眼罩，另一人只能透過「扶肩膀」或「牽手」引導到下一間7-11。
2 隊內選出二位公主抱到下一關。(體力不支可以換人如全員男孩放棄需每人喝一杯)
3 全隊男女手牽手到下一關
4 全隊男女交錯搭火車到下一關
5 拿一根吸管用嘴巴和鼻子夾住，如果中途吸管掉下來，懲罰蛙跳5下或開合跳10下
6 親親大亂鬥！全隊男女親親五秒「各自分組」不得與本來的伴侶執行遊戲
7 隊內隨機配對，男生背女生到下一關。
8 隊內剪刀石頭布，最贏那位為國王可指定任務
9 愛上鐵達尼！隊內挑選一男一女擺出鐵達尼經典姿勢動作一路到下一關，路程中不能分開
10 每隊自行選出一位女孩牽二位男孩到下一關
11 每隊自行選出一位男孩牽二位女孩到下一關
12 抽到此簽，隊伍男男互牽 女女互牽到下一關
12 男生靠牆坐空氣椅，女生坐在男生的腿上維持 15 秒；或是全隊男女交錯坐前一人的腿上形成人肉椅子。
13 隊長福利可自由選對方隊伍一位做任何事
14 騎馬打仗二位男孩當馬兒，選一位女孩上馬到下一關
15 隊內選出二位女孩，蒙眼選出二位男生擁抱10秒
16 用繩子或膠帶將一男一女的腳綁在一起(二對)，且移動過程中兩人必須手牽手，走到指定區域。</textarea>

            <h3>🅱️ 駐點喝酒遊戲籤筒</h3>
            <textarea id="boxB">1 五、十、十五 兩人一組，喊中數字的人贏，輸的喝。
2 我有你沒有 輪流說一件自己「沒做過」的事，有做過的人就喝。
3 黑白配 經典手指方向遊戲，二人一組輸的的人喝。
4 人緣好...大家數到三，指一個人，被指最多的人喝。
5 大老二(簡易版)每人抽一張牌，點數最小的三個人負責喝。
6 成語接龍 上一家的最後一字接下一家的第一字，斷掉就喝。
7 看誰比較快 所有人一起乾杯，最後放下的那個人要加碼喝。
8 抓鬼遊戲 隊長當鬼，鬼做什麼動作大家要跟著做，最後做的與"隊長"一起喝。
9 國王遊戲 抽籤當國王，國王可以指名 1~6 號中的任意組合喝。
10 隊長指定敵對二位喝</textarea>

            <h3>🍻 7-11 盲飲酒單籤筒</h3>
            <textarea id="boxC">1 低酒精飲料（0.5% ~ 5%）
2 低酒精飲料（0.5% ~ 5%）
3 低酒精飲料（0.5% ~ 5%）
4 中酒精飲料（6% ~ 15%）
5 中酒精飲料（6% ~ 15%）
6 高酒精烈酒（20% ~ 58%+）</textarea>
            
            <button onclick="closeSettings()" style="background: linear-gradient(45deg, #11998e, #38ef7d); margin-top: 25px; box-shadow: 0 4px 15px rgba(56, 239, 125, 0.4);">✅ 完成並關閉</button>
        </div>
    </div>

    <script>
        // --- Modal 彈出視窗控制 ---
        function openSettings() {
            document.getElementById('settingsModal').style.display = 'block';
        }

        function closeSettings() {
            document.getElementById('settingsModal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('settingsModal');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }

        // --- 網址壓縮與本地儲存同步功能 ---
        function encodeData(data) {
            const jsonStr = JSON.stringify(data);
            // 使用 LZString 壓縮，大幅減少網址長度
            return LZString.compressToEncodedURIComponent(jsonStr);
        }

        function decodeData(hashStr) {
            try {
                // 先嘗試用 LZString 解壓縮 (新版短網址)
                const jsonStr = LZString.decompressFromEncodedURIComponent(hashStr);
                if (jsonStr) {
                    return JSON.parse(jsonStr);
                }
            } catch (e) {
                console.log("LZString 解壓失敗，嘗試舊版 Base64");
            }
            
            try {
                // 若失敗，退回使用舊版的 Base64 解碼 (相容舊網址)
                const binaryStr = atob(hashStr);
                const utf8Bytes = new Uint8Array(binaryStr.split('').map(c => c.charCodeAt(0)));
                const decodedStr = new TextDecoder().decode(utf8Bytes);
                return JSON.parse(decodedStr);
            } catch (e) {
                return null;
            }
        }

        function saveAllData() {
            const maleInputs = Array.from(document.querySelectorAll('#male-inputs input')).map(i => i.value);
            const femaleInputs = Array.from(document.querySelectorAll('#female-inputs input')).map(i => i.value);
            
            const data = {
                m: maleInputs,
                f: femaleInputs,
                a: document.getElementById('boxA').value,
                b: document.getElementById('boxB').value,
                c: document.getElementById('boxC').value
            };

            // 1. 儲存到本地 (本地單機備份)
            localStorage.setItem('alcoholRunData', JSON.stringify(data));
            
            // 2. 壓縮後更新到網址列 (跨裝置分享用)
            try {
                const encoded = encodeData(data);
                window.history.replaceState(null, null, "#" + encoded);
            } catch (e) {
                console.error("網址更新失敗", e);
            }
        }

        function loadAllData() {
            let data = null;
            
            // 1. 優先讀取網址中的資料
            if (window.location.hash.length > 1) {
                data = decodeData(window.location.hash.substring(1));
            }
            
            // 2. 如果網址沒資料，讀取本地儲存
            if (!data) {
                const saved = localStorage.getItem('alcoholRunData');
                if (saved) {
                    try {
                        data = JSON.parse(saved);
                    } catch (e) {}
                }
            }

            // 3. 將資料填入畫面
            if (data) {
                const maleInputs = document.querySelectorAll('#male-inputs input');
                (data.m || []).forEach((name, index) => {
                    if (maleInputs[index]) maleInputs[index].value = name;
                });

                const femaleInputs = document.querySelectorAll('#female-inputs input');
                (data.f || []).forEach((name, index) => {
                    if (femaleInputs[index]) femaleInputs[index].value = name;
                });

                if (data.a) document.getElementById('boxA').value = data.a;
                if (data.b) document.getElementById('boxB').value = data.b;
                if (data.c) document.getElementById('boxC').value = data.c;
                
                // 載入完成後，自動更新一次網址確保穩定
                saveAllData();
            }
        }

        function copyShareLink() {
            // 先儲存確保拿到最新網址
            saveAllData(); 
            const url = window.location.href;
            navigator.clipboard.writeText(url).then(() => {
                alert("✅ 專屬壓縮網址已複製！\n\n因為採用了進階壓縮技術，這串網址已經被大幅縮短。請將此網址傳送到手機，打開後就會自動同步名單！");
            }).catch(err => {
                alert("複製失敗，請手動複製瀏覽器上方的完整網址！");
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            // 等待 LZString 載入完成後再執行讀取
            if (typeof LZString !== 'undefined') {
                loadAllData();
            } else {
                // 如果套件還沒載入完，稍微延遲一下
                setTimeout(loadAllData, 500);
            }

            // 綁定所有姓名輸入框、籤筒的自動儲存事件
            const allInputs = document.querySelectorAll('.name-list input, textarea');
            allInputs.forEach(input => {
                input.addEventListener('input', saveAllData);
            });
        });

        // --- 分組與抽籤功能 ---
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function selectCaptain(team) {
            if(team.length === 0) return 0;
            let weights = [];
            let totalWeight = 0;
            for(let i = 0; i < team.length; i++) {
                let name = team[i].name.trim();
                if(name.toLowerCase() === 'james' || name.toUpperCase() === 'MK') {
                    weights.push(120); totalWeight += 120;
                } else {
                    weights.push(100); totalWeight += 100;
                }
            }
            let randomValue = Math.random() * totalWeight;
            let currentSum = 0;
            for(let i = 0; i < team.length; i++) {
                currentSum += weights[i];
                if(randomValue <= currentSum) return i;
            }
            return 0;
        }

        function formatTeamHTML(team, colorClass, title) {
            if(team.length === 0) return '';
            
            const captain = team.find(m => m.isCaptain) || team[0];
            const males = team.filter(m => m.gender === 'M' && !m.isCaptain).map(m => m.name);
            const females = team.filter(m => m.gender === 'F' && !m.isCaptain).map(m => m.name);

            return `
                <div class="team-display">
                    <span class="team-title" style="color:${colorClass}">${title} (${team.length}人)</span>
                    <div class="member-line">👑 <strong>隊長：</strong><span style="color:#ffb199; font-weight:bold; font-size: 18px;">${captain.name}</span></div>
                    <div class="member-line">👦 <strong>男生：</strong>${males.length > 0 ? males.join('、') : '無'}</div>
                    <div class="member-line">👧 <strong>女生：</strong>${females.length > 0 ? females.join('、') : '無'}</div>
                </div>
            `;
        }

        function generateTeams() {
            let malePool = Array.from(document.querySelectorAll('#male-inputs input')).map(i => i.value).filter(v => v.trim() !== '');
            let femalePool = Array.from(document.querySelectorAll('#female-inputs input')).map(i => i.value).filter(v => v.trim() !== '');

            malePool = shuffleArray(malePool);
            femalePool = shuffleArray(femalePool);

            let t1MaleCount = Math.floor(malePool.length / 2);
            let t2MaleCount = malePool.length - t1MaleCount;
            if (malePool.length % 2 !== 0 && Math.random() > 0.5) {
                [t1MaleCount, t2MaleCount] = [t2MaleCount, t1MaleCount];
            }

            let t1FemaleCount = Math.floor(femalePool.length / 2);
            let t2FemaleCount = femalePool.length - t1FemaleCount;
            
            if (t1MaleCount > t2MaleCount) {
                t1FemaleCount = Math.floor(femalePool.length / 2);
                t2FemaleCount = femalePool.length - t1FemaleCount;
            } else if (t2MaleCount > t1MaleCount) {
                t2FemaleCount = Math.floor(femalePool.length / 2);
                t1FemaleCount = femalePool.length - t2FemaleCount;
            } else {
                if (femalePool.length % 2 !== 0 && Math.random() > 0.5) {
                    [t1FemaleCount, t2FemaleCount] = [t2FemaleCount, t1FemaleCount];
                }
            }

            let t1_m = malePool.slice(0, t1MaleCount).map(n => ({name: n, gender: 'M'}));
            let t2_m = malePool.slice(t1MaleCount).map(n => ({name: n, gender: 'M'}));

            let t1_f = femalePool.slice(0, t1FemaleCount).map(n => ({name: n, gender: 'F'}));
            let t2_f = femalePool.slice(t1FemaleCount).map(n => ({name: n, gender: 'F'}));

            let team1 = [...t1_m, ...t1_f];
            let team2 = [...t2_m, ...t2_f];

            if(team1.length > 0) team1[selectCaptain(team1)].isCaptain = true;
            if(team2.length > 0) team2[selectCaptain(team2)].isCaptain = true;

            const resultDiv = document.getElementById('team-result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = formatTeamHTML(team1, '#ff6b81', '🔴 你喜歡我對不隊') + formatTeamHTML(team2, '#7bed9f', '🔵 肝硬化');
        }

        // 單一抽籤 (適用於 A 關卡)
        function drawGame(boxId, resultId) {
            const text = document.getElementById(boxId).value;
            const items = text.split('\n').filter(i => i.trim() !== '');
            const resultDiv = document.getElementById(resultId);
            resultDiv.style.display = 'block';
            
            if(items.length === 0) {
                resultDiv.innerHTML = `<span style="color:#ff6b81;">籤筒是空的，請至設定補充內容！</span>`;
                return;
            }
            
            const randomIndex = Math.floor(Math.random() * items.length);
            resultDiv.innerHTML = `🎯 <strong>抽中任務：</strong> <br><br> <span style="color:#f5af19; font-size: 22px; font-weight: bold; text-shadow: 0 0 5px rgba(245,175,25,0.5);">${items[randomIndex]}</span>`;
        }

        // 雙重合併抽籤 (適用於 B 遊戲 + C 酒單)
        function drawCombinedGame(boxId1, boxId2, resultId) {
            const text1 = document.getElementById(boxId1).value;
            const items1 = text1.split('\n').filter(i => i.trim() !== '');
            
            const text2 = document.getElementById(boxId2).value;
            const items2 = text2.split('\n').filter(i => i.trim() !== '');

            const resultDiv = document.getElementById(resultId);
            resultDiv.style.display = 'block';
            
            if(items1.length === 0 || items2.length === 0) {
                resultDiv.innerHTML = `<span style="color:#ff6b81;">任務或酒單籤筒為空，請至設定補充內容！</span>`;
                return;
            }
            
            const random1 = Math.floor(Math.random() * items1.length);
            const random2 = Math.floor(Math.random() * items2.length);

            resultDiv.innerHTML = `
                🃏 <strong>派對遊戲：</strong> <br>
                <span style="color:#a8c0ff; font-size: 20px; font-weight: bold; display:block; margin: 10px 0 20px 0;">${items1[random1]}</span>
                
                🍻 <strong>搭配酒單：</strong> <br>
                <span style="color:#ff9a9e; font-size: 22px; font-weight: bold; text-shadow: 0 0 8px rgba(255,154,158,0.5); display:block; margin-top: 10px;">${items2[random2]}</span>
            `;
        }
    </script>
</body>
</html>
