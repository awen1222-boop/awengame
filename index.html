<!DOCTYPE html>

    <style>

<body>

    <header>

        <!-- 喝酒遊戲 + 盲飲酒單 -->
        <div class="card">

            <button class="btn-draw-combo" onclick="drawCombinedGame('boxB', 'boxC', 'resultB')">🥂 一鍵雙抽：派對遊戲 ＆ 專屬酒單</button>

    <!-- ==================== 分頁 2: 大風吹分組 ==================== -->
    <div id="tab2" class="tab-content">
        <div class="card">
            <h2>🌪️ 大風吹隨機配對 (共 10 隊)</h2>
            <div class="input-grid">
                <div class="name-list" id="male-inputs-2">
                    <h3>🕺 男生名單</h3>
                    <input type="text" value="男1">
                    <input type="text" value="男2">
                    <input type="text" value="男3">
                    <input type="text" value="男4">
                    <input type="text" value="男5">
                    <input type="text" value="男6">
                    <input type="text" value="男7">

                <div class="name-list" id="female-inputs-2">

                    <input type="text" value="女1">
                    <input type="text" value="女2">
                    <input type="text" value="女3">
                    <input type="text" value="女4">
                    <input type="text" value="女5">
                    <input type="text" value="女6">
                    <input type="text" value="女7">
                    <input type="text" value="女8">
                    <input type="text" value="女9">

            </div>
            <button class="btn-draw-combo" onclick="generateWindTeams()">🌪️ 男女隨機分組</button>
            <div id="wind-team-result" class="result-box" style="display: none;"></div>
        </div>
    </div>

    <!-- ==================== 分頁 3: 大冒險 ==================== -->
    <div id="tab3" class="tab-content">
        <div class="card">
            <h2>🔥 大冒險任務抽取</h2>
            
            <div class="adv-settings">
                <div class="adv-row">
                    <label>總對數：</label>
                    <select id="advTeamCount">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8" selected>8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                    </select>
                </div>
                <div class="adv-row">
                    <label>任務等級：</label>
                    <div class="level-group">
                        <button class="level-btn" id="lvl-low" onclick="setAdvLevel('low')">低</button>
                        <button class="level-btn active" id="lvl-mid" onclick="setAdvLevel('mid')">中</button>
                        <button class="level-btn" id="lvl-high" onclick="setAdvLevel('high')">高</button>
                    </div>
                </div>
            </div>

            <button class="btn-adventure" onclick="drawAdventure()">🔥 大冒險</button>

        </div>
    </div>

    <!-- ==================== 底部固定區域 ==================== -->
    <div class="action-bar">
        <button class="btn-settings" onclick="openSettings()" style="margin-top: 0; flex: 1;">⚙️ 進入後台：編輯遊戲與酒單</button>
        <div class="sync-status-box" id="syncStatus">
            🔄 連線中...
        </div>
    </div>

    <!-- ==================== 編輯內容彈出視窗 (Modal) ==================== -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <h2>⚙️ 編輯內容 (輸入即自動儲存)</h2>
            
            <h3 style="color:#ffb199; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom:5px;">🍻 【分頁 1】酒精路跑題庫</h3>
            <h3>🅰️ 下一關遊戲籤</h3>
            <textarea id="boxA">1 一人戴眼罩，另一人只能透過「扶肩膀」或「牽手」引導到下一間7-11。
2 隊內選出二位公主抱到下一關。
3 全隊男女手牽手到下一關</textarea>
            <h3>🅱️ 喝酒遊戲籤筒</h3>
            <textarea id="boxB">1 五、十、十五 兩人一組，喊中數字的人贏，輸的喝。
2 我有你沒有 輪流說一件自己「沒做過」的事，有做過的人就喝。</textarea>
            <h3>🍻 7-11 盲飲酒單籤筒</h3>
            <textarea id="boxC">1 低酒精飲料（0.5% ~ 5%）
2 中酒精飲料（6% ~ 15%）
3 高酒精烈酒（20% ~ 58%+）</textarea>
            
            <h3 style="color:#ffb199; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom:5px; margin-top:30px;">🔥 【分頁 3】大冒險任務題庫</h3>
            <h3>🟢 大冒險 - 低 (Low)</h3>
            <textarea id="advLow">跟指定對象深情對視 10 秒
原地轉 5 圈後金雞獨立 5 秒</textarea>
            <h3>🟡 大冒險 - 中 (Mid)</h3>
            <textarea id="advMid">牽著指定對象的手走到下一關
對指定對象唱一首情歌</textarea>
            <h3>🔴 大冒險 - 高 (High)</h3>
            <textarea id="advHigh">公主抱指定對象並深蹲 3 下
安全之吻 10 秒</textarea>

            <button onclick="closeSettings()" style="background: linear-gradient(45deg, #11998e, #38ef7d); margin-top: 25px;">✅ 完成並關閉</button>
        </div>
    </div>

    <script>
        // ==========================================
        // UI 切換邏輯 (分頁與難易度選擇)
        // ==========================================
        let currentAdvLevel = 'mid'; // 預設難度為中

        function switchTab(tabId) {
            // 隱藏所有分頁
            document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
            // 移除所有按鈕的 active 狀態
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active-tab'));
            
            // 顯示選中分頁
            document.getElementById(tabId).style.display = 'block';
            document.getElementById('btn-' + tabId).classList.add('active-tab');
        }

        function setAdvLevel(level) {
            currentAdvLevel = level;
            // 更新 UI 狀態
            document.querySelectorAll('.level-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('lvl-' + level).classList.add('active');
        }

        // ==========================================
        // Firebase 初始化與資料同步
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyAicnJwTpTewbmyxQBcCb-Cu-0Hcupry88",
            authDomain: "my-couple-game-8cfcd.firebaseapp.com",
            databaseURL: "https://my-couple-game-8cfcd-default-rtdb.firebaseio.com",
            projectId: "my-couple-game-8cfcd",
            storageBucket: "my-couple-game-8cfcd.firebasestorage.app",
            messagingSenderId: "1088332175776",
            appId: "1:1088332175776:web:a348c6b6c08687c8fa6cc5",
            measurementId: "G-820GYBHKW2"
        };

        let dataRef = null;
        
        try {
            firebase.initializeApp(firebaseConfig);
            const db = firebase.database();
            dataRef = db.ref('alcoholRunDataV2'); // 更新路徑避免覆蓋舊版
            
            document.getElementById('syncStatus').innerHTML = '🟢 雲端即時同步中';
            document.getElementById('syncStatus').style.color = '#7bed9f';
        } catch (error) {
            console.error("Firebase 初始化失敗：", error);
            document.getElementById('syncStatus').innerHTML = '🔴 連線失敗';
            document.getElementById('syncStatus').style.color = '#ff6b81';
        }

        let saveTimeout = null;

        function triggerSave() {
            if (!dataRef) return;
            
            clearTimeout(saveTimeout);
            document.getElementById('syncStatus').innerHTML = '🔄 儲存中...';
            document.getElementById('syncStatus').style.color = '#f5af19';

            saveTimeout = setTimeout(() => {
                const data = {
                    // 分頁 1 名單
                    m1: Array.from(document.querySelectorAll('#male-inputs input')).map(i => i.value),
                    f1: Array.from(document.querySelectorAll('#female-inputs input')).map(i => i.value),
                    // 分頁 2 名單
                    m2: Array.from(document.querySelectorAll('#male-inputs-2 input')).map(i => i.value),
                    f2: Array.from(document.querySelectorAll('#female-inputs-2 input')).map(i => i.value),
                    
                    // 題庫儲存
                    a: document.getElementById('boxA').value,
                    b: document.getElementById('boxB').value,
                    c: document.getElementById('boxC').value,
                    advLow: document.getElementById('advLow').value,
                    advMid: document.getElementById('advMid').value,
                    advHigh: document.getElementById('advHigh').value,
                    
                    timestamp: Date.now()
                };

                dataRef.set(data).then(() => {
                    document.getElementById('syncStatus').innerHTML = '🟢 雲端即時同步中';
                    document.getElementById('syncStatus').style.color = '#7bed9f';
                });
            }, 800);
        }

        if (dataRef) {
            dataRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) updateUI(data);
            });
        }

        function updateUI(data) {
            // 輔助函式：更新陣列資料到指定的 input 群組，若被 focused 則跳過
            const fillInputs = (selector, dataArray) => {
                const inputs = document.querySelectorAll(selector);
                (dataArray || []).forEach((val, index) => {
                    if (inputs[index] && document.activeElement !== inputs[index]) {
                        inputs[index].value = val;
                    }
                });
            };
            
            fillInputs('#male-inputs input', data.m1);
            fillInputs('#female-inputs input', data.f1);
            fillInputs('#male-inputs-2 input', data.m2);
            fillInputs('#female-inputs-2 input', data.f2);

            // 輔助函式：更新 textarea 題庫
            const fillTextarea = (id, val) => {
                const el = document.getElementById(id);
                if(val && document.activeElement !== el) el.value = val;
            };

            fillTextarea('boxA', data.a);
            fillTextarea('boxB', data.b);
            fillTextarea('boxC', data.c);
            fillTextarea('advLow', data.advLow);
            fillTextarea('advMid', data.advMid);
            fillTextarea('advHigh', data.advHigh);
        }

        // 綁定儲存事件
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('input, textarea').forEach(el => {
                el.addEventListener('input', triggerSave);
            });
        });

        // ==========================================
        // Modal 控制
        // ==========================================
        function openSettings() { document.getElementById('settingsModal').style.display = 'block'; }
        function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }
        window.onclick = function(event) {
            if (event.target == document.getElementById('settingsModal')) closeSettings();
        }

        // 共用洗牌函式
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // ==========================================
        // 分頁 1: 酒精路跑分組與遊戲邏輯
        // ==========================================
        function selectCaptain(team) {
            if(team.length === 0) return 0;
            let maleIndices = [];
            let weights = [], totalWeight = 0;
            
            for(let i = 0; i < team.length; i++) {
                if(team[i].gender === 'M') {
                    maleIndices.push(i);
                    let name = team[i].name.trim();
                    if(name.toLowerCase() === 'james' || name.toUpperCase() === 'MK') { weights.push(120); totalWeight += 120; } 
                    else { weights.push(100); totalWeight += 100; }
                }
            }
            if(maleIndices.length === 0) return Math.floor(Math.random() * team.length);

            let randomValue = Math.random() * totalWeight, currentSum = 0;
            for(let j = 0; j < maleIndices.length; j++) {
                currentSum += weights[j];
                if(randomValue <= currentSum) return maleIndices[j];
            }
            return maleIndices[0];
        }

        function formatTeamHTML(team, colorClass, title) {
            if(team.length === 0) return '';
            const captain = team.find(m => m.isCaptain) || team[0];
            const males = team.filter(m => m.gender === 'M' && !m.isCaptain).map(m => m.name);
            const females = team.filter(m => m.gender === 'F' && !m.isCaptain).map(m => m.name);
            return `
                <div class="team-display">
                    <span class="team-title" style="color:${colorClass}">${title} (${team.length}人)</span>
                    <div class="member-line">👑 <strong>隊長：</strong><span style="color:#ffb199; font-weight:bold; font-size: 18px;">${captain.name}</span></div>
                    <div class="member-line">👦 <strong>男生：</strong>${males.length > 0 ? males.join('、') : '無'}</div>
                    <div class="member-line">👧 <strong>女生：</strong>${females.length > 0 ? females.join('、') : '無'}</div>
                </div>
            `;
        }

        function generateTeams() {
            let malePool = Array.from(document.querySelectorAll('#male-inputs input')).map(i => i.value).filter(v => v.trim() !== '');
            let femalePool = Array.from(document.querySelectorAll('#female-inputs input')).map(i => i.value).filter(v => v.trim() !== '');
            
            let t1_m = [], t2_m = [];
            let t1_f = [], t2_f = [];

            let hasSteve = malePool.includes('史帝夫');
            let hasHoney = femalePool.includes('蜜糖');

            if (hasSteve && hasHoney) {
                malePool = malePool.filter(n => n !== '史帝夫');
                femalePool = femalePool.filter(n => n !== '蜜糖');
                
                let sameTeam = Math.random() < 0.7;
                let targetTeamForSteve = Math.random() < 0.5 ? 1 : 2;
                
                if (targetTeamForSteve === 1) {
                    t1_m.push('史帝夫');
                    sameTeam ? t1_f.push('蜜糖') : t2_f.push('蜜糖');
                } else {
                    t2_m.push('史帝夫');
                    sameTeam ? t2_f.push('蜜糖') : t1_f.push('蜜糖');
                }
            }

            malePool = shuffleArray(malePool); 
            femalePool = shuffleArray(femalePool);

            let totalMales = malePool.length + t1_m.length + t2_m.length;
            let totalFemales = femalePool.length + t1_f.length + t2_f.length;

            let targetT1Males = Math.floor(totalMales / 2);
            let targetT2Males = totalMales - targetT1Males;
            if (totalMales % 2 !== 0 && Math.random() > 0.5) [targetT1Males, targetT2Males] = [targetT2Males, targetT1Males];

            let targetT1Females = Math.floor(totalFemales / 2);
            let targetT2Females = totalFemales - targetT1Females;
            
            if (targetT1Males > targetT2Males) { targetT1Females = Math.floor(totalFemales / 2); targetT2Females = totalFemales - targetT1Females; } 
            else if (targetT2Males > targetT1Males) { targetT2Females = Math.floor(totalFemales / 2); targetT1Females = totalFemales - targetT2Females; } 
            else if (totalFemales % 2 !== 0 && Math.random() > 0.5) [targetT1Females, targetT2Females] = [targetT2Females, targetT1Females];

            while (malePool.length > 0) {
                if (t1_m.length < targetT1Males) t1_m.push(malePool.pop());
                else if (t2_m.length < targetT2Males) t2_m.push(malePool.pop());
                else { (t1_m.length <= t2_m.length) ? t1_m.push(malePool.pop()) : t2_m.push(malePool.pop()); }
            }

            while (femalePool.length > 0) {
                if (t1_f.length < targetT1Females) t1_f.push(femalePool.pop());
                else if (t2_f.length < targetT2Females) t2_f.push(femalePool.pop());
                else { (t1_f.length <= t2_f.length) ? t1_f.push(femalePool.pop()) : t2_f.push(femalePool.pop()); }
            }

            let team1 = [...t1_m.map(n => ({name: n, gender: 'M'})), ...t1_f.map(n => ({name: n, gender: 'F'}))];
            let team2 = [...t2_m.map(n => ({name: n, gender: 'M'})), ...t2_f.map(n => ({name: n, gender: 'F'}))];

            if(team1.length > 0) team1[selectCaptain(team1)].isCaptain = true;
            if(team2.length > 0) team2[selectCaptain(team2)].isCaptain = true;

            const resultDiv = document.getElementById('team-result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = formatTeamHTML(team1, '#ff6b81', '🔴 你喜歡我對不隊') + formatTeamHTML(team2, '#7bed9f', '🔵 肝硬化');
        }

        function drawGame(boxId, resultId) {
            const items = document.getElementById(boxId).value.split('\n').filter(i => i.trim() !== '');
            const resultDiv = document.getElementById(resultId);
            resultDiv.style.display = 'block';
            if(items.length === 0) return resultDiv.innerHTML = `<span style="color:#ff6b81;">籤筒是空的，請至設定補充內容！</span>`;
            resultDiv.innerHTML = `🎯 <strong>抽中任務：</strong> <br><br> <span style="color:#f5af19; font-size: 22px; font-weight: bold; text-shadow: 0 0 5px rgba(245,175,25,0.5);">${items[Math.floor(Math.random() * items.length)]}</span>`;
        }

        function drawCombinedGame(boxId1, boxId2, resultId) {
            const items1 = document.getElementById(boxId1).value.split('\n').filter(i => i.trim() !== '');
            const items2 = document.getElementById(boxId2).value.split('\n').filter(i => i.trim() !== '');
            const resultDiv = document.getElementById(resultId);
            resultDiv.style.display = 'block';
            if(items1.length === 0 || items2.length === 0) return resultDiv.innerHTML = `<span style="color:#ff6b81;">任務或酒單籤筒為空，請至設定補充內容！</span>`;
            resultDiv.innerHTML = `
                🃏 <strong>派對遊戲：</strong> <br>
                <span style="color:#a8c0ff; font-size: 20px; font-weight: bold; display:block; margin: 10px 0 20px 0;">${items1[Math.floor(Math.random() * items1.length)]}</span>
                🍻 <strong>搭配酒單：</strong> <br>
                <span style="color:#ff9a9e; font-size: 22px; font-weight: bold; text-shadow: 0 0 8px rgba(255,154,158,0.5); display:block; margin-top: 10px;">${items2[Math.floor(Math.random() * items2.length)]}</span>
            `;
        }

        // ==========================================
        // 分頁 2: 大風吹分組邏輯
        // ==========================================
        function generateWindTeams() {
            let malePool = Array.from(document.querySelectorAll('#male-inputs-2 input')).map(i => i.value).filter(v => v.trim() !== '');
            let femalePool = Array.from(document.querySelectorAll('#female-inputs-2 input')).map(i => i.value).filter(v => v.trim() !== '');
            
            malePool = shuffleArray(malePool);
            femalePool = shuffleArray(femalePool);

            let htmlStr = '';
            // 產出固定 10 隊
            for (let i = 0; i < 10; i++) {
                let m = malePool[i] || "無(空缺)";
                let f = femalePool[i] || "無(空缺)";
                htmlStr += `
                    <div style="background: rgba(255,255,255,0.05); padding: 10px 15px; margin-bottom: 8px; border-radius: 8px; border-left: 3px solid #7bed9f; display:flex; justify-content:space-between; align-items:center;">
                        <strong style="color: #ffb199; font-size: 18px;">第 ${i + 1} 隊</strong>
                        <span>🕺 ${m} &nbsp; 💖 &nbsp; 💃 ${f}</span>
                    </div>
                `;
            }

            const resultDiv = document.getElementById('wind-team-result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = htmlStr;
        }

        // ==========================================
        // 分頁 3: 大冒險抽籤邏輯
        // ==========================================
        function drawAdventure() {
            // 取得所選難易度的題庫
            let textareaId = '';
            let levelTitle = '';
            let color = '';
            
            if (currentAdvLevel === 'low') {
                textareaId = 'advLow';
                levelTitle = '🟢 輕度冒險';
                color = '#38ef7d';
            } else if (currentAdvLevel === 'mid') {
                textareaId = 'advMid';
                levelTitle = '🟡 中度冒險';
                color = '#f5af19';
            } else {
                textareaId = 'advHigh';
                levelTitle = '🔴 深度冒險';
                color = '#ff416c';
            }

            const items = document.getElementById(textareaId).value.split('\n').filter(i => i.trim() !== '');
            const resultDiv = document.getElementById('adv-result');
            resultDiv.style.display = 'block';
            
            if(items.length === 0) {
                resultDiv.innerHTML = `<span style="color:#ff6b81;">該難度籤筒為空，請至設定補充內容！</span>`;
                return;
            }

            // 隨機抽取任務
            const task = items[Math.floor(Math.random() * items.length)];
            
            // 根據選單隨機抽出隊伍編號 (1 ~ 所選對數)
            const teamCount = parseInt(document.getElementById('advTeamCount').value, 10);
            const targetTeam = Math.floor(Math.random() * teamCount) + 1;

            resultDiv.innerHTML = `
                <div style="margin-bottom: 15px; font-size: 16px; color: rgba(255,255,255,0.7);">
                    難度：<strong style="color:${color};">${levelTitle}</strong>
                </div>
                <div style="font-size: 24px; font-weight: bold; margin-bottom: 20px;">
                    請 <span style="color:#a8c0ff; font-size: 30px; text-shadow: 0 0 10px #a8c0ff;">第 ${targetTeam} 隊</span> 出列！
                </div>
                <div style="background: rgba(255,255,255,0.1); padding: 20px; border-radius: 12px; border: 1px solid ${color};">
                    <div style="font-size: 14px; color: rgba(255,255,255,0.5); margin-bottom: 10px;">執行任務：</div>
                    <div style="color: ${color}; font-size: 22px; font-weight: bold; line-height: 1.4;">
                        ${task}
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
