<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X 酒精路跑之我沒醉X</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            background: linear-gradient(180deg, #f1c40f 0%, #e67e22 100%);
            padding: 40px 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }
        header::before {
            content: "◦ ◦ ◦ ◦ ◦";
            position: absolute;
            bottom: 10px;
            left: 20px;
            color: rgba(255,255,255,0.5);
            font-size: 24px;
        }
        h1 {
            margin: 0;
            color: white;
            font-size: 32px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .card {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .card h2 {
            margin-top: 0;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
            color: #2980b9;
        }
        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .name-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .name-list input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .vip-section {
            margin-top: 15px;
            padding: 15px;
            background-color: #fcf3cf;
            border-radius: 5px;
            border-left: 5px solid #f1c40f;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2ecc71;
        }
        .btn-draw {
            background-color: #e67e22;
        }
        .result-box {
            margin-top: 15px;
            padding: 15px;
            background-color: #e8f8f5;
            border-left: 5px solid #1abc9c;
            border-radius: 4px;
            font-size: 18px;
            line-height: 1.6;
        }
        .team-display {
            padding: 10px;
            margin-bottom: 10px;
            background: #fff;
            border-radius: 8px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.05);
        }
        .team-title { font-weight: bold; font-size: 20px; margin-bottom: 10px; display: block; }
        .member-line { margin: 5px 0; }
        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            resize: vertical;
        }
    </style>
</head>
<body>

    <header>
        <h1>🍺 X 酒精路跑之我沒醉X 🏃‍♂️</h1>
    </header>

    <!-- 分組系統 -->
    <div class="card">
        <h2>👥 隨機分隊</h2>
        <div class="input-grid">
            <div class="name-list" id="male-inputs">
                <h3>男生名單</h3>
                <input type="text" value="MK">
                <input type="text" value="james">
                <input type="text" value="阿文">
                <input type="text" value="史迪">
                <input type="text" id="m5" value="andy">
                <input type="text" id="m6" value="台北E">
                <input type="text" id="m7" value="楊過">
            </div>
            <div class="name-list" id="female-inputs">
                <h3>女生名單</h3>
                <input type="text" value="Bella">
                <input type="text" value="琳琳">
                <input type="text" value="crystal">
                <input type="text" value="奇奇">
                <input type="text" value="cindy">
                <input type="text" value="台北D">
                <input type="text" value="小龍女">
            </div>
        </div>
        
        <div class="vip-section">
            <label style="font-weight:bold;">🌟 特別來賓：</label>
            <input type="text" id="vip" value="EC" style="padding: 5px; width: 100px; margin-left:10px;">
        </div>

        <button onclick="generateTeams()">一鍵隨機分隊</button>
        <div id="team-result" class="result-box" style="display: none;"></div>
    </div>

    <!-- 遊戲、酒單籤筒保持原樣 -->
    <div class="card">
        <h2>🅰️ 遊戲籤筒 (行動關卡)</h2>
        <textarea id="boxA">1 一人戴眼罩，另一人只能透過「扶肩膀」或「牽手」引導到下一間7-11。
2 公主抱到下一關。(體力不支可以換人如全員男孩放棄需每人喝一杯)
3 全隊男女手牽手到下一關
4 全隊男女交錯搭火車到下一關
5 一男一女兩兩手勾手橫著走到下一關
6 拿一根吸管用嘴巴和鼻子夾住，如果中途吸管掉下來，懲罰蛙跳5下或開合跳10下
7 便利商店買膠帶，兩人三腳走到下一關
8 親親大亂鬥！全隊男女親親五秒「各自分組」不得與本來的伴侶執行遊戲
9 老背少！挑一位男生背隊內年紀最小的女生走行至下一關，中間可換人但必須也是比女生年紀大者。
10 愛的小秘密！隊內剪刀石頭布，最輸的兩個人與敵對進行真心話遊戲。回答一個私密問題。
11 我殺豬養你呀！隊內挑選一位男性為敵對女性購買對方想吃的小零食，並以口對口餵敵方女生吃。
12 老娘千杯不醉！隊內一位女生隨機找一位路人乾杯🍻並且說出「老娘千杯不醉」。
13 一首歌的時間！隊內選出一位歌手，一路唱歌抵達下一站，中途如果歌曲結束下一關不管輸贏都要多喝一杯。
14 魷魚🦑遊戲！全隊在人行道上尋找一根柱子玩123木頭人，最輸的下一站不管輸贏多喝一杯。
15 愛上鐵達尼！隊內挑選一男一女擺出鐵達尼經典姿勢動作一路到下一關，路程中不能分開
16 每隊自行選出一位女孩牽二位男孩到下一關
17 每隊自行選出一位男孩牽二位女孩到下一關
18 抽到此簽，隊伍男男互牽 女女互牽到下一關
19 選出 ? 位戴著"頭套"到下一關
20 隊長福利可自由選對方隊伍一位做任何事
21 騎馬打仗二位男孩當馬兒，選一位女孩上馬到下一關</textarea>
        <button class="btn-draw" onclick="drawGame('boxA', 'resultA')">一鍵抽取 遊戲籤</button>
        <div id="resultA" class="result-box" style="display: none;"></div>
    </div>

    <div class="card">
        <h2>🅱️ 喝酒遊戲籤筒 (駐點遊戲)</h2>
        <textarea id="boxB">1 五、十、十五
2 我有你沒有
3 黑白配
4 人緣好...指一個人，被指最多的人喝。
5 大老二(簡易版)
6 成語接龍
7 看誰比較快
8 抓鬼遊戲
9 國王遊戲
10 隊長指定敵對二位喝</textarea>
        <button class="btn-draw" onclick="drawGame('boxB', 'resultB')">一鍵抽取 喝酒遊戲</button>
        <div id="resultB" class="result-box" style="display: none;"></div>
    </div>

    <div class="card">
        <h2>🍻 7-11 盲飲酒單籤筒</h2>
        <textarea id="boxC">1 金牌台灣啤酒
2 18天台灣生啤酒
3 Kirin 冰結 水果調酒
4 HOROYOI 微醉沙瓦
5 海尼根 Heineken
6 百威啤酒 Budweiser
7 檸檬堂 日式檸檬沙瓦
8 韓國真露燒酒
9 SOMERSBY 夏日蜜蘋果酒
10 WAT 瓶裝雞尾酒
11 Asahi 朝日 Super Dry
12 臺虎精釀系列
13 Kirin 麒麟一番搾
14 傑克丹尼 可樂威士忌調酒
15 絕對伏特加 Absolut (小樣酒系列)</textarea>
        <button class="btn-draw" onclick="drawGame('boxC', 'resultC')">一鍵抽取 7-11 酒款</button>
        <div id="resultC" class="result-box" style="display: none;"></div>
    </div>

    <script>
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function selectCaptain(team) {
            let weights = [];
            let totalWeight = 0;
            for(let i = 0; i < team.length; i++) {
                let name = team[i].name.trim();
                if(name === 'james' || name === 'MK') {
                    weights.push(120); totalWeight += 120;
                } else {
                    weights.push(100); totalWeight += 100;
                }
            }
            let randomValue = Math.random() * totalWeight;
            let currentSum = 0;
            for(let i = 0; i < team.length; i++) {
                currentSum += weights[i];
                if(randomValue <= currentSum) return i;
            }
            return 0;
        }

        function formatTeamHTML(team, colorClass, title) {
            // 分類隊員
            const captain = team.find(m => m.isCaptain);
            const males = team.filter(m => m.gender === 'M' && !m.isCaptain).map(m => m.name);
            const females = team.filter(m => m.gender === 'F' && !m.isCaptain).map(m => m.name);

            return `
                <div class="team-display">
                    <span class="team-title" style="color:${colorClass}">${title} (${team.length}人)</span>
                    <div class="member-line">👑 <strong>隊長：</strong><span style="color:#c0392b; font-weight:bold;">${captain.name}</span></div>
                    <div class="member-line">👦 <strong>男生：</strong>${males.join('、')}</div>
                    <div class="member-line">👧 <strong>女生：</strong>${females.join('、')}</div>
                </div>
            `;
        }

        function generateTeams() {
            let malePool = Array.from(document.querySelectorAll('#male-inputs input')).map(i => i.value).filter(v => v !== '');
            let femalePool = Array.from(document.querySelectorAll('#female-inputs input')).map(i => i.value).filter(v => v !== '');
            let vip = document.getElementById('vip').value;

            // 隨機打亂後各取 6 人 (維持 3M3F 兩隊的基本規模)
            malePool = shuffleArray(malePool).slice(0, 6);
            femalePool = shuffleArray(femalePool).slice(0, 6);

            // 包裝成物件
            let t1_m = malePool.slice(0, 3).map(n => ({name: n, gender: 'M'}));
            let t2_m = malePool.slice(3, 6).map(n => ({name: n, gender: 'M'}));
            let t1_f = femalePool.slice(0, 3).map(n => ({name: n, gender: 'F'}));
            let t2_f = femalePool.slice(3, 6).map(n => ({name: n, gender: 'F'}));

            let team1 = [...t1_m, ...t1_f];
            let team2 = [...t2_m, ...t2_f];

            // VIP 加入
            if(Math.random() > 0.5) team1.push({name: vip, gender: 'F'}); else team2.push({name: vip, gender: 'F'});

            // 選隊長
            team1[selectCaptain(team1)].isCaptain = true;
            team2[selectCaptain(team2)].isCaptain = true;

            const resultDiv = document.getElementById('team-result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = formatTeamHTML(team1, '#e74c3c', '🔴 第一隊') + formatTeamHTML(team2, '#3498db', '🔵 第二隊');
        }

        function drawGame(boxId, resultId) {
            const text = document.getElementById(boxId).value;
            const items = text.split('\n').filter(i => i.trim() !== '');
            const resultDiv = document.getElementById(resultId);
            resultDiv.style.display = 'block';
            if(items.length === 0) return;
            const randomIndex = Math.floor(Math.random() * items.length);
            resultDiv.innerHTML = `🎯 <strong>抽中：</strong> <br><br> <span style="color:#d35400; font-size: 22px; font-weight: bold;">${items[randomIndex]}</span>`;
        }
    </script>
</body>
</html>
